name: Presentation template

on:
  push:
    branches: [master, codex/presentation-template]
    paths: ['presentation-template/**', '.github/workflows/presentation-template.yml']
  pull_request:
    paths: ['presentation-template/**', '.github/workflows/presentation-template.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Check generated HTML is current
        run: git diff --exit-code -- index.html
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fold-browser-evidence
          path: presentation-template/test-results/
